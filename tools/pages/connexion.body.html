    <section class="auth" aria-labelledby="login-title">
{{AUTH_ASIDE}}
      <div class="auth__main">
        <div class="auth__card" data-view="login">
          <div data-ph-fade>
            <h1 class="auth__title" id="login-title">Connexion à votre espace</h1>
            <p class="auth__sub">Associations, professionnels et équipe Locana.</p>
          </div>
          <form class="form-card" id="login-form" novalidate data-ph-fade>
            <div class="fields">
              <p class="form-alert full" aria-live="assertive"><i data-lucide="info"></i><span></span></p>
              <label class="field full">
                <span class="field__label">Adresse e-mail</span>
                <input class="field__input" type="email" name="email" autocomplete="username" inputmode="email" required>
                <span class="field__error"><i data-lucide="info"></i><span></span></span>
              </label>
              <div class="field full">
                <label class="field__label" for="login-pw">Mot de passe</label>
                <div class="pw-wrap">
                  <input class="field__input" id="login-pw" type="password" name="password" autocomplete="current-password" required>
                  <button class="pw-toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false"><i data-lucide="eye"></i></button>
                </div>
                <span class="field__error"><i data-lucide="info"></i><span></span></span>
                <button class="link-btn" type="button" data-show="forgot">Mot de passe oublié ?</button>
              </div>
              <div class="full"><button class="btn btn--lg magnetic" type="submit" style="width:100%">Se connecter <i data-lucide="arrow-right" data-arrow></i></button></div>
            </div>
          </form>
          <p class="auth__alt" data-ph-fade>Pas encore de compte ? <a href="inscription.html">Inscrire mon association ou mon entreprise</a></p>
        </div>

        <div class="auth__card" data-view="forgot" hidden>
          <div>
            <h1 class="auth__title">Mot de passe oublié</h1>
            <p class="auth__sub">Indiquez l’adresse de votre compte : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>
          </div>
          <form class="form-card" id="forgot-form" novalidate>
            <div class="fields">
              <p class="form-alert full" aria-live="polite"><i data-lucide="info"></i><span></span></p>
              <label class="field full">
                <span class="field__label">Adresse e-mail</span>
                <input class="field__input" type="email" name="email" autocomplete="email" inputmode="email" required>
                <span class="field__error"><i data-lucide="info"></i><span></span></span>
              </label>
              <div class="full"><button class="btn btn--lg" type="submit" style="width:100%">Recevoir le lien <i data-lucide="send" data-arrow></i></button></div>
            </div>
          </form>
          <p class="auth__alt"><button class="link-btn" type="button" data-show="login" style="justify-self:center">Retour à la connexion</button></p>
        </div>
      </div>
    </section>
